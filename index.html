 if(pid=='dealer')pid='d-'+oid;const key=type+pid;
 if(type=='views'){try{if(sessionStorage.getItem(key))return;sessionStorage.setItem(key,1)}catch(e){}}
 else{const n=Date.now();if(TRK.has(key)&&n-TRK.get(key)<30000)return;TRK.set(key,n)}
 const day=new Date().toISOString().slice(0,10);
 db.doc('stats/'+pid+'_'+day).set({pid,oid,day,[type]:firebase.firestore.FieldValue.increment(1)},{merge:true}).catch(()=>{})}catch(e){}}
const dayStr=n=>new Date(Date.now()-n*864e5).toISOString().slice(0,10);
const agg=(rows,a,b)=>{const r={views:0,wa:0,call:0,map:0};rows.forEach(x=>{if(x.day>=a&&x.day<=b)for(const k in r)r[k]+=x[k]||0});return r};

 if(!rows)return H+`<p class=note>…</p>`;if(!rows.length)return H+`<p class=note>${t('noStats')}</p>`;
 const cur=agg(rows,dayStr(6),dayStr(0)),prev=agg(rows,dayStr(13),dayStr(7)),m=agg(rows,dayStr(29),dayStr(0)),n=cur.wa+cur.call+cur.map,ar=S.lang=='ar';
 const head=n?(ar?`🔔 تواصل معك <b>${n}</b> شخص هذا الأسبوع`:`🔔 <b>${n}</b> people contacted you this week`):(ar?'لم يتواصل أحد هذا الأسبوع بعد — أضف صوراً ومواصفات أكثر':'No contacts this week yet — add more photos and specs');
 const tile=(k,v,pv)=>`<div><b>${v}</b><small>${t(k)}</small><i>${trend(v,pv)}</i></div>`,per={};
 rows.forEach(x=>{if(x.day>=dayStr(6)&&x.day<=dayStr(0)&&!String(x.pid).startsWith('d-')){const o=per[x.pid]=per[x.pid]||{v:0,c:0};o.v+=x.views||0;o.c+=(x.wa||0)+(x.call||0)+(x.map||0)}});
 const top=Object.entries(per).map(([id,o])=>({p:S.prods.find(q=>q.id==id),...o})).filter(x=>x.p).sort((a,b)=>b.c-a.c||b.v-a.v).slice(0,5);
 return H+`<p style="margin:0 0 8px">${head}</p><div class=sgrid>${tile('sViews',cur.views,prev.views)}${tile('sWa',cur.wa,prev.wa)}${tile('sCall',cur.call,prev.call)}${tile('sMap',cur.map,prev.map)}</div>
 <p class=note>${t('last30')}: 👁 ${m.views} · 💬 ${m.wa} · 📞 ${m.call} · 📍 ${m.map} &nbsp; (▲▼ ${t('vsPrev')})</p>
 ${top.length?`<h4 style="margin:10px 0 4px">${t('sTop')}</h4>${top.map(x=>`<div class=trow><span>${esc(x.p.brand)} ${esc(x.p.model)}</span><small>👁 ${x.v} · 📞 ${x.c}</small></div>`).join('')}`:''}<p class=note>${t('statNote')}</p>`}
